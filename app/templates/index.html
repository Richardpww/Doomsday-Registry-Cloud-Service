<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>UMKM Inventory</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>UMKM Inventory</h1>
  <p>
    Access level: <input id="lvl" type="number" min="0" max="3" value="0" style="width:60px">
    <button onclick="load()">Reload</button><br>
    <small class="hint">(0-1 = supplier hidden, 2-3 = supplier visible)</small>
  </p>

  <fieldset>
    <legend>Add product</legend>
    <input id="cat" placeholder="Category">
    <input id="name" placeholder="Product name">
    <input id="sup" placeholder="Supplier">
    <input id="desc" placeholder="Description">
    <input id="stock" type="number" min="0" placeholder="Stock" style="width:80px">
    <button onclick="add()">Add</button>
  </fieldset>

  <p id="msg"></p>
  <ul id="list"></ul>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
